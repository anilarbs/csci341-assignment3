<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConfAdmin | Research Conference</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#f3f6fa;color:#17243a}aside{width:230px;position:fixed;inset:0 auto 0 0;background:#14243b;color:#b6c5d8;padding:28px 17px;display:flex;flex-direction:column}h1,h2,h3,p{margin:0} .brand{font-size:24px;color:white;font-weight:800;letter-spacing:-1px}.muted{color:#687991}.sub{font-size:12px;color:#9aacc4}nav{margin:32px 0;display:grid;gap:6px}button,a{font:inherit}button{cursor:pointer;border:1px solid #d9e2ee;border-radius:8px;padding:9px 14px;background:white;color:#233650}nav button{background:transparent;border:0;color:inherit;text-align:left;padding:12px 14px}nav button.active{background:#315683;color:white}aside a{color:#c4d6ed;text-decoration:none;margin-top:auto}main{margin-left:230px}header{background:white;border-bottom:1px solid #e1e7ef;padding:18px 32px;display:flex;justify-content:space-between;align-items:center}#content{padding:32px;max-width:1500px;margin:auto}h1{font-size:29px;letter-spacing:-.7px}h2{font-size:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.primary{background:#285b9b;color:white;border-color:#285b9b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:24px 0}.card,.panel{background:white;border:1px solid #e0e7f0;border-radius:12px;padding:20px;box-shadow:0 2px 5px #152b4010}.card strong{display:block;font-size:34px;color:#285b9b;margin:5px 0}.card{cursor:pointer;text-align:left}.panel{margin:16px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:#687991;background:#f6f8fb;letter-spacing:.5px}td,th{padding:13px;border-bottom:1px solid #e8edf3}td:last-child{white-space:nowrap}td button{padding:5px 9px;margin-right:5px}.danger{color:#b42335}.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:#e7eef9;color:#285b9b;font-size:12px}.accepted,.accept{background:#e0f3e9;color:#147347}.rejected,.reject,.withdrawn{background:#fce8e9;color:#a52e40}.under-review{background:#fff1d7;color:#955b00}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd7e4;border-radius:7px;background:white;font:inherit;color:#17243a}input[type=checkbox]{width:auto}textarea{min-height:80px}#search{max-width:300px}dialog{border:0;border-radius:14px;width:min(800px,95vw);max-height:90vh;padding:0;box-shadow:0 20px 80px #10223855}dialog::backdrop{background:#15243b77}.modalhead,.modalfoot{padding:18px 24px;background:white;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;z-index:2}.modalhead{top:0;border-bottom:1px solid #e2e8f0}.modalfoot{bottom:0;border-top:1px solid #e2e8f0}#fields{padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-weight:600;font-size:13px}label input,label select,label textarea{margin-top:5px;font-weight:400}.wide,fieldset{grid-column:1/-1}fieldset{border:1px solid #dbe3ed;border-radius:9px;padding:14px;min-width:0}legend{font-weight:700}.nested{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;padding:12px;background:#f5f7fa;border-radius:8px}.nested button{justify-self:start}#notice,#formerror{white-space:pre-wrap;overflow-wrap:anywhere;color:#a52e40}#notice:empty,#formerror:empty{display:none}#notice{padding:12px;background:#fff0f0;border-radius:8px;margin-bottom:12px}#formerror{padding:8px 24px}#toast{position:fixed;bottom:20px;right:20px;background:#173b35;color:white;padding:14px 20px;border-radius:8px;display:none;z-index:10} @media(max-width:800px){aside{position:static;width:100%;padding:15px}nav{display:flex;flex-wrap:wrap;margin:12px 0}nav button{padding:8px}main{margin:0}#content,header{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}#fields{grid-template-columns:1fr}.top{flex-wrap:wrap}}
</style></head><body><aside><div class="brand">ConfAdmin<span style="color:#81b5f5">.</span></div><div class="sub">RESEARCH CONFERENCE SYSTEM</div><nav id="nav"></nav><a href="/docs">API documentation ↗</a><div class="sub" style="margin-top:12px">CSCI 341 · Assignment 3</div></aside><main><header><b>Conference administration</b><span id="connection" class="muted">Connecting…</span></header><div id="content"><div id="notice"></div><div id="page"></div></div></main><dialog id="modal"><form id="editor"><div class="modalhead"><h2 id="formtitle"></h2><button type="button" id="close">Close</button></div><div id="fields"></div><div id="formerror" role="alert"></div><div class="modalfoot"><span class="muted">Changes are saved to PostgreSQL.</span><button class="primary" id="save">Save record</button></div></form></dialog><div id="toast" role="status"></div><script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const resources=['users','papers','reviews','sessions'], keys={users:'user_id',papers:'paper_id',reviews:'review_id',sessions:'session_id'}, labels={users:'Users',papers:'Papers',reviews:'Reviews',sessions:'Sessions',dashboard:'Dashboard',schedule:'Schedule',reference:'Reference data'}, columns={users:['user_id','given_name','surname','email','affiliation','country','phone_number'],papers:['paper_id','title','track_id','status','submission_date','session_id'],reviews:['review_id','paper_id','reviewer_id','overall_score','recommendation','review_submission_date'],sessions:['session_id','title','conference_id','session_date','start_time','end_time','room_label','chair_id']};
let current='dashboard', data={}, ref={}, details=[], editing=null, generation=0;
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(r.status===204)return null;let v;try{v=await r.json()}catch{v=null}if(!r.ok){const d=v?.detail;throw Error(Array.isArray(d)?d.map(x=>x.loc.slice(1).join(' / ')+': '+x.msg).join('\n'):d||`HTTP ${r.status}: request failed`)}return v}
function title(k){return k.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase())}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}
async function load(){const results=await Promise.all([...resources.map(x=>api('/'+x)),api('/reference')]);resources.forEach((x,i)=>data[x]=results[i]);ref=results[4];$('#connection').textContent='● Database connected';$('#connection').style.color='#147347'}
function nav(){ $('#nav').innerHTML=Object.keys(labels).map(k=>`<button class="${k===current?'active':''}" data-nav="${k}">${labels[k]}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.nav)) }
function table(rows,cols,actions=false){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(title(c))}</th>`).join('')}${actions?'<th>Actions</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${['status','recommendation'].includes(c)?`<span class="pill ${esc(String(r[c]).replaceAll(' ','-'))}">${esc(r[c])}</span>`:esc(r[c]??'—')}</td>`).join('')}${actions?`<td><button data-edit="${r[keys[current]]}">Edit</button><button class="danger" data-delete="${r[keys[current]]}">Delete</button></td>`:''}</tr>`).join('')}</tbody></table>${rows.length?'':'<p style="padding:20px" class="muted">No records found.</p>'}</div>`}
async function show(k){current=k;const g=++generation;nav();$('#notice').textContent='';$('#page').innerHTML='<p class="muted">Loading records…</p>';try{await load();if(g!==generation)return;let p=$('#page');if(k==='dashboard'){p.innerHTML=`<h1>Dashboard</h1><p class="muted">Live overview of your research conference database.</p><div class="cards">${resources.map(x=>`<button class="card" data-go="${x}">${labels[x]}<strong>${data[x].length}</strong>View records →</button>`).join('')}</div><div class="panel"><h2>Paper status</h2>${['submitted','under review','accepted','rejected','withdrawn'].map(s=>{let n=data.papers.filter(x=>x.status===s).length;return `<div style="display:grid;grid-template-columns:110px 1fr 30px;align-items:center;gap:10px;margin:14px 0"><span>${s}</span><div style="background:#eaf0f7;border-radius:5px;height:10px"><div style="background:#427bb8;height:10px;border-radius:5px;width:${100*n/Math.max(1,data.papers.length)}%"></div></div><b>${n}</b></div>`}).join('')}</div><div class="panel"><h2>Conferences</h2>${table(ref.conference||[],['acronym','name','city','start_date','end_date'])}</div>`;p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));return}if(k==='schedule'){const r=await api('/schedule');if(g!==generation)return;p.innerHTML=`<h1>Accepted paper schedule</h1><p class="muted">Live database view</p><div class="panel">${table(r,Object.keys(r[0]||{}))}</div>`;return}if(k==='reference'){p.innerHTML='<h1>Reference data</h1><p class="muted">Read-only supporting relations</p>'+Object.entries(ref).map(([t,r])=>`<div class="panel"><h2>${esc(title(t))}</h2>${table(r,Object.keys(r[0]||{}))}</div>`).join('');return}p.innerHTML=`<div class="top"><div><h1>${labels[k]}</h1><p class="muted">${data[k].length} records · Manage conference ${k}</p></div><button class="primary" id="add">+ Add record</button></div><div class="panel"><input id="search" placeholder="Search records…" aria-label="Search records"><div id="listing"></div></div>`;function render(){const q=$('#search').value.toLowerCase();$('#listing').innerHTML=table(data[k].filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q))),columns[k],true);$('#listing').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(+b.dataset.edit));$('#listing').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(+b.dataset.delete))}$('#search').oninput=render;$('#add').onclick=()=>openEditor(null);render()}catch(e){if(g===generation){$('#notice').textContent=e.message;$('#connection').textContent='Connection / request error'}}}
const fieldSpecs={users:[['given_name'],['surname'],['email','email'],['affiliation'],['country'],['phone_number']],papers:[['title'],['abstract','textarea'],['track_id','track'],['submission_date','date'],['status','status'],['session_id','sessions',true],['keywords','labels']],reviews:[['paper_id','papers'],['reviewer_id','reviewers'],['overall_score','number'],['recommendation','recommendation'],['comments_for_authors','textarea'],['confidential_comments','textarea',true],['review_submission_date','date']],sessions:[['conference_id','conference'],['title'],['session_date','date'],['start_time','time'],['end_time','time'],['room_label'],['chair_id','reviewers']]};
function choices(type){const userLabel=u=>`${u.user_id} · ${u.given_name} ${u.surname}`;switch(type){case 'authors':return details.filter(u=>u.author).map(u=>[u.user_id,userLabel(u)]);case 'reviewers':return details.filter(u=>u.reviewer).map(u=>[u.user_id,userLabel(u)]);case 'track':return (ref.track||[]).map(r=>[r.track_id,`${r.track_id} · ${r.name}`]);case 'conference':return (ref.conference||[]).map(r=>[r.conference_id,`${r.conference_id} · ${r.acronym}`]);case 'papers':case 'sessions':return data[type].map(r=>[r[keys[type]],`${r[keys[type]]} · ${r.title}`]);case 'status':return ['submitted','under review','accepted','rejected','withdrawn'].map(v=>[v,v]);case 'recommendation':return ['accept','reject'].map(v=>[v,v]);default:return null}}
function field(spec,obj={}){let [k,t='text',optional=false]=spec,v=obj[k]??'',options=choices(t),numeric=['number','authors','reviewers','track','conference','papers','sessions'].includes(t),a=`data-field="${k}" data-type="${numeric?'number':t}" ${optional?'':'required'}`,control;if(t==='checkbox')control=`<input type="checkbox" data-field="${k}" data-type="checkbox" ${v?'checked':''}>`;else if(options)control=`<select ${a}><option value="">${optional?'None':'Select…'}</option>${options.map(([id,name])=>`<option value="${esc(id)}" ${String(id)===String(v)?'selected':''}>${esc(name)}</option>`).join('')}</select>`;else if(t==='textarea'||t==='labels')control=`<textarea ${a} placeholder="${t==='labels'?'One value per line':''}">${esc(t==='labels'?(Array.isArray(v)?v.join('\n'):v):v)}</textarea>`;else control=`<input type="${t}" ${a} ${t==='number'?'step="1" min="'+(k==='years_experience'?0:1)+'" '+(k==='overall_score'?'max="5"':''):t==='time'||t==='datetime-local'?'step="1"':''} value="${esc(t==='datetime-local'?String(v).slice(0,19):v)}">`;return `<label class="${['textarea','labels'].includes(t)?'wide':''}">${esc(title(k))}${optional?' (optional)':''}${control}</label>`}
const nestedSpecs={authors:[['author_id','authors'],['author_position','number'],['is_corresponding','checkbox']],versions:[['version_no','number'],['file_location'],['uploaded_at','datetime-local'],['change_note','textarea',true]]};
function nestedRow(name,v){const div=document.createElement('div');div.className='nested';div.innerHTML=nestedSpecs[name].map(s=>field(s,v)).join('')+'<button type="button" class="danger">Remove</button>';div.querySelector('button').onclick=()=>div.remove();return div}
function addNested(name,v={}){const root=$('#group-'+name);root.append(nestedRow(name,v))}
function profile(name,v){const specs=name==='author'?[['orcid','text',true],['areas','labels']]:[['years_experience','number'],['expertise','labels']];return `<fieldset><legend>${title(name)} profile</legend><label><input type="checkbox" id="enable-${name}" ${v?'checked':''}> Enable ${name} role</label><div id="profile-${name}" class="nested" ${v?'':'hidden'}>${specs.map(s=>field(s,v||{})).join('')}</div></fieldset>`}
function toggleProfile(name){const on=$('#enable-'+name).checked,p=$('#profile-'+name);p.hidden=!on;p.style.display=on?'grid':'none';p.querySelectorAll('input,textarea,select').forEach(e=>e.disabled=!on)}
function readFields(root){let obj={};for(const e of root.querySelectorAll('[data-field]')){if(e.disabled)continue;let v=e.value,t=e.dataset.type;obj[e.dataset.field]=t==='checkbox'?e.checked:t==='number'?(v===''?null:Number(v)):t==='labels'?v.split('\n').map(s=>s.trim()).filter(Boolean):v===''?null:v}return obj}
async function openEditor(id){const k=current;try{let r=id===null?{}:await api('/'+k+'/'+id);details=await Promise.all(data.users.map(u=>api('/users/'+u.user_id)));if(current!==k)return;editing={k,id};$('#formtitle').textContent=(id===null?'Create ':'Edit ')+labels[k].replace(/s$/,'');$('#formerror').textContent='';$('#fields').innerHTML='<div id="base" class="wide" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">'+fieldSpecs[k].map(s=>field(s,r)).join('')+'</div>';if(k==='users'){for(const name of ['author','reviewer']){$('#fields').insertAdjacentHTML('beforeend',profile(name,r[name]));$('#enable-'+name).onchange=()=>toggleProfile(name);toggleProfile(name)}}if(k==='papers'){for(const name of ['authors','versions']){$('#fields').insertAdjacentHTML('beforeend',`<fieldset><legend>${title(name)}</legend><div id="group-${name}"></div><button type="button" id="add-${name}">+ Add ${name==='authors'?'author':'version'}</button></fieldset>`);$('#add-'+name).onclick=()=>addNested(name);(r[name]||[{}]).forEach(v=>addNested(name,v))}}$('#modal').showModal()}catch(e){$('#notice').textContent=e.message}}
$('#close').onclick=()=>$('#modal').close();$('#editor').onsubmit=async e=>{e.preventDefault();const {k,id}=editing,b=readFields($('#base'));if(k==='users')for(const n of ['author','reviewer'])b[n]=$('#enable-'+n).checked?readFields($('#profile-'+n)):null;if(k==='papers')for(const n of ['authors','versions'])b[n]=Array.from($('#group-'+n).children).map(readFields);$('#save').disabled=true;$('#formerror').textContent='';try{await api('/'+k+(id===null?'':'/'+id),id===null?'POST':'PUT',b);$('#modal').close();toast('Record saved');show(k)}catch(err){$('#formerror').textContent=err.message}finally{$('#save').disabled=false}};
async function remove(id){const k=current;if(!confirm(`Delete ${labels[k].toLowerCase()} record #${id}? This cannot be undone.`))return;try{await api('/'+k+'/'+id,'DELETE');toast('Record deleted');show(k)}catch(e){$('#notice').textContent=e.message}}
show('dashboard');
</script></body></html>
